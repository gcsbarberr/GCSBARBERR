<!DOCTYPE html>
<html lang="es"> // cambio de idioma a español 
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Vikingos Master </title> // Se le asigna el tito al modulo del registro de usuarios 

</head>
<body>

    // Todo el contenido interactivo y visual va aqui

    <div class="registro-container">
        <h2>Crear Cuenta en Vikingos Master</h2>

        <form id="form-registro">
            <div class="grupo-input">
                <label for="reg-nombre">Nombre Completo:</label>
                <input type="text" id="reg-nombre" required>
            </div>
            <div class="grupo-input">
                <label for="reg-correo">Coreeo Electrónico</label>
                <input type="email" id="reg-correo" required>
                </div>

                <div class="grupo-input">
                    <label for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" required>
                </div>
                
                
                <button type="submit" class="btm-primario">Registrarme</button>
                </form>

   
                

</body>
</html>
