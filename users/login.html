<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Vikingos Master</title>
    <!-- Aquí conectamos tu archivo local, cero internet requerido -->
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>

    <!-- Caja principal -->
    <div class="caja-registro">
        <h2>Crear Cuenta en Vikingos Master</h2>
       
        <form id="form-registro">
            <!-- Campo: Nombre -->
            <div class="grupo-input">
                <label for="reg-nombre">Nombre Completo:</label>
                <input type="text" id="reg-nombre" required>
            </div>
        
            <!-- Campo: Correo -->
            <div class="grupo-input">
                <label for="reg-correo">Correo Electrónico:</label>
                <input type="email" id="reg-correo" required>
            </div>

            <!-- Campo: Contraseña -->
            <div class="grupo-input">
                <label for="reg-password">Contraseña:</label>
                <input type="password" id="reg-password" required>
            </div>

            <!-- Botón de envio -->
            <button type="submit" class="btn-rojo">Registrarme</button>
        </form>
    </div>
         <script src="../js/scripts.js"></script>      
</body>
</html>
